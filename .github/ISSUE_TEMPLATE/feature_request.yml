name: Feature request
description: Suggest a new feature or improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting an improvement. Describe the problem you're trying to solve, not only the solution.
  - type: textarea
    id: problem
    attributes:
      label: Problem or motivation
      description: What problem would this solve? Who would benefit?
      placeholder: e.g. I want to ... so that ...
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How do you think we could solve it?
      optional: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      optional: true
