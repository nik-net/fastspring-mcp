name: Bug report
description: Report unexpected or incorrect behavior
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please fill in the sections below.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear description of the bug
      placeholder: What happened?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Exact steps to reproduce the behavior
      placeholder: |
        1. Start server with ...
        2. Call tool X with ...
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What you expected to happen
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What actually happened (error message, wrong result, etc.)
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node.js version
      placeholder: e.g. 22.0.0
  - type: input
    id: transport
    attributes:
      label: Transport
      placeholder: stdio or http
  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      description: Paste relevant log lines (redact credentials and PII)
      render: shell
  - type: textarea
    id: extra
    attributes:
      label: Additional context
      optional: true
