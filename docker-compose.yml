# ─────────────────────────────────────────────────────────────────────────────
# HOW TO SUPPLY CREDENTIALS
# ─────────────────────────────────────────────────────────────────────────────
# Sensitive values are NEVER baked into the image.  They are resolved at
# runtime via standard environment-variable substitution (${VAR}).
# Docker Compose resolves ${VAR} in this file from — in priority order:
#
#   1. Shell environment variables already exported in your terminal:
#        export FS_API_USERNAME=xxx && docker compose up
#
#   2. A .env file in this directory (for local dev convenience only):
#        cp .env.example .env && fill in your values
#
#   3. A secrets manager / CI/CD injector (recommended for production):
#        e.g. AWS Secrets Manager, HashiCorp Vault, GitHub Actions secrets
#
# The .env file is listed in .dockerignore — it is NEVER copied into the image.
# ─────────────────────────────────────────────────────────────────────────────

services:
  fastspring-mcp:
    build:
      context: .
      target: production
    image: fastspring-mcp:with-tags
    container_name: fastspring-mcp

    environment:
      # ── Required credentials ─────────────────────────────────────────────
      # Must be supplied via shell env / CI secrets / secrets manager.
      # No default values — the server will fail fast with a clear error if
      # either of these is missing.
      FS_API_USERNAME: "${FS_API_USERNAME}"
      FS_API_PASSWORD: "${FS_API_PASSWORD}"

      # ── Optional credentials ─────────────────────────────────────────────
      # Required only for Classic (legacy) API order-reference lookups.
      FS_COMPANY_ID: "${FS_COMPANY_ID:-}"

      # ── Logging ──────────────────────────────────────────────────────────
      FS_LOG_LEVEL: "${FS_LOG_LEVEL:-info}"
      FS_DEBUG: "${FS_DEBUG:-false}"
      FS_LOG_DIR: "/app/logs"

      # ── Transport (always HTTP in the container) ──────────────────────────
      MCP_TRANSPORT: "http"
      MCP_HTTP_HOST: "0.0.0.0"
      MCP_HTTP_PORT: "${MCP_HTTP_PORT:-3000}"
      MCP_HTTP_PATH: "${MCP_HTTP_PATH:-/mcp}"
      MCP_HTTP_STATELESS: "${MCP_HTTP_STATELESS:-false}"

      # ── Authentication ────────────────────────────────────────────────────
      MCP_AUTH_ENABLED: "${MCP_AUTH_ENABLED:-false}"
      MCP_API_KEYS: "${MCP_API_KEYS:-}"

      NODE_ENV: "production"

    ports:
      - "${MCP_HTTP_PORT:-3000}:${MCP_HTTP_PORT:-3000}"

    volumes:
      # Persist log files on the host so they survive container restarts.
      - ./logs:/app/logs

    restart: unless-stopped

    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:${MCP_HTTP_PORT:-3000}/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
